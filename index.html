<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- 导航栏 -->
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="#hero" class="navbar-logo">Home</a>
      <button class="hamburger" id="hamburger" aria-label="菜单">
        <i data-lucide="menu"></i>
      </button>
      <nav class="nav-links" id="navLinks">
        <a href="#about">关于我</a>
        <a href="#skills">技能</a>
        <a href="#timeline">AI 历程</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="section hero" id="hero">
    <div class="hero-content">
      <div class="hero-avatar">
        <div class="avatar-placeholder">
          <i data-lucide="user" size="48"></i>
        </div>
      </div>
      <h1 class="hero-name"></h1>
      <p class="hero-title"></p>
      <p class="hero-dedication"></p>
    </div>
  </section>

  <!-- 关于我 -->
  <section class="section" id="about">
    <h2 class="section-title">关于我</h2>
    <div class="about-content">
      <p class="about-text"></p>
      <div class="education-card">
        <h3><i data-lucide="book-open" size="20"></i> 教育背景</h3>
        <div class="education-list"></div>
      </div>
    </div>
  </section>

  <!-- 技能 -->
  <section class="section section-alt" id="skills">
    <h2 class="section-title">技能</h2>
    <div class="skills-cloud" id="skillsCloud"></div>
  </section>

  <!-- AI 历程 -->
  <section class="section" id="timeline">
    <h2 class="section-title">AI 学习历程</h2>
    <div class="timeline" id="timelineContainer"></div>
  </section>

  <!-- 项目 -->
  <section class="section section-alt" id="projects">
    <h2 class="section-title">项目经历</h2>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- 联系 -->
  <section class="section" id="contact">
    <h2 class="section-title">联系方式</h2>
    <div class="contact-list" id="contactList"></div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 — Built with Claude Code</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/markdown-loader.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
